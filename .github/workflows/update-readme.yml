name: Actualizar README

on:
  schedule:
    - cron: '0 6 * * *'   # todos los días a las 6:00 UTC (1:00 am Lima)
  workflow_dispatch:       # también puedes ejecutarlo manualmente desde la pestaña Actions
  push:
    branches: [ main, master ]

jobs:
  actividad-reciente:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Actualizar actividad reciente
        uses: TheDanniCraft/activity-log@v1
        with:
          GITHUB_USERNAME: "JeanHaro"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: "docs: actualizar actividad reciente"

  tiempo-programando:
    runs-on: ubuntu-latest
    needs: actividad-reciente
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Calcular tiempo programando
        run: |
          START_DATE="2020-10-01"
          NOW=$(date +%s)
          START=$(date -d "$START_DATE" +%s)
          DIFF_DAYS=$(( (NOW - START) / 86400 ))
          YEARS=$(( DIFF_DAYS / 365 ))
          MONTHS=$(( (DIFF_DAYS % 365) / 30 ))
          TEXT="⏱️ programando desde hace ${YEARS} años y ${MONTHS} meses"
          sed -i "s|<!--START_SECTION:coding-time-->.*<!--END_SECTION:coding-time-->|<!--START_SECTION:coding-time--> ${TEXT} <!--END_SECTION:coding-time-->|" README.md

      - name: Commitear cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: actualizar tiempo programando"
          git push

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generar snake de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: JeanHaro
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
